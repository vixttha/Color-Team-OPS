name: Color OPS CLI evaluation development regression (owner runners)
on:
  push:
    branches: [feature/v0.0.2-codex-independent-eval]
    paths: [devtools/**, tests/**, .github/scripts/cli_eval_ci.py, .github/workflows/v0.0.2-cli-eval-dev.yml]
permissions:
  contents: read
jobs:
  regression:
    if: github.repository == 'vixttha/Color-Team-OPS' && github.ref == 'refs/heads/feature/v0.0.2-codex-independent-eval'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            name: color-team-ops-windows-01
          - os: Linux
            name: color-team-ops-linux-01
    runs-on: [self-hosted, X64, color-team-ops, '${{ matrix.os }}']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact source native suite on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUNNER: ${{ matrix.name }}
        run: python3 -B .github/scripts/cli_eval_ci.py
      - name: Exact source native suite on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUNNER: ${{ matrix.name }}
        run: |
          python -B .github/scripts/cli_eval_ci.py
          if ($LASTEXITCODE -ne 0) { throw 'Development regression failed' }
