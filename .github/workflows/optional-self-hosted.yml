name: Color Team OPS - optional personal runners

on:
  workflow_dispatch:
    inputs:
      allow_personal_runners:
        description: "I authorize supplemental testing of reviewed main on my Windows and Linux runners"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  supplemental-windows:
    if: github.actor == 'vixttha' && github.ref == 'refs/heads/main' && inputs.allow_personal_runners
    name: Optional Windows validation
    runs-on: [self-hosted, Windows, X64, color-team-ops]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Validate portable release
        shell: powershell
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

  supplemental-linux:
    if: github.actor == 'vixttha' && github.ref == 'refs/heads/main' && inputs.allow_personal_runners
    name: Optional Linux validation
    runs-on: [self-hosted, Linux, X64, color-team-ops]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Validate portable release
        shell: bash
        run: python3 -B -m unittest discover -s tests -p "test_*.py" -v
