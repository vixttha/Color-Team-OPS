# Internal ONE-SHOT release-review smoke. Runs code only from a pinned, 24-file
# portable candidate on existing owner self-hosted runners. No PR or hosted CI.
name: Idea Feature Library v0.0.2 standalone package smoke
on:
  push:
    branches: [idea-feature-library-v0.0.2]
    paths:
      - ops/acceptance/idea-feature-library-v002-package-smoke-arm.txt
permissions:
  contents: read
concurrency:
  group: idea-feature-v002-package-smoke-owner-lane
  cancel-in-progress: false

jobs:
  package-linux:
    name: HEAD → WORKER → VALIDATE clean package on Linux
    if: >-
      github.repository == 'vixttha/Color-Team-OPS' &&
      github.ref == 'refs/heads/idea-feature-library-v0.0.2' &&
      github.actor == 'vixttha' &&
      github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, color-team-ops]
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      PACKAGE_SHA: a3fdbcbc36632146ef6be6fbec68d60be50c3e85
      EXPECTED_EVENT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact developer harness without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
          clean: true
      - name: Checkout exact self-contained package without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a3fdbcbc36632146ef6be6fbec68d60be50c3e85
          path: package
          persist-credentials: false
          clean: true
      - name: HEAD verify scope, SHA and actual trusted runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = color-team-ops-linux-01
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(git -C harness rev-parse HEAD)" = "$EXPECTED_EVENT_SHA"
          test "$(git -C package rev-parse HEAD)" = "$PACKAGE_SHA"
          test "$(cat harness/ops/acceptance/idea-feature-library-v002-package-smoke-arm.txt)" = "APPROVED-V002-CLEAN-PACKAGE-ONESHOT"
          test ! -e package/.github
          test ! -e package/ops
          test ! -e package/governance
          test ! -e package/AGENTS.md
          echo "PACKAGE_HEAD_PREFLIGHT_PASS=$PACKAGE_SHA"
      - name: WORKER execute clean package test and disposable fresh-host simulation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B harness/.github/scripts/v002_portable_package_smoke.py --package package --sha "$PACKAGE_SHA"
          echo "PACKAGE_STANDALONE_LINUX_PASS=$PACKAGE_SHA"

  package-windows:
    name: VALIDATE Windows → INTERNAL AUDITOR → HEAD release smoke
    needs: [package-linux]
    if: >-
      github.repository == 'vixttha/Color-Team-OPS' &&
      github.ref == 'refs/heads/idea-feature-library-v0.0.2' &&
      github.actor == 'vixttha'
    runs-on: [self-hosted, Windows, X64, color-team-ops]
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      PACKAGE_SHA: a3fdbcbc36632146ef6be6fbec68d60be50c3e85
      EXPECTED_EVENT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact developer harness without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
          clean: true
      - name: Checkout exact portable candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a3fdbcbc36632146ef6be6fbec68d60be50c3e85
          path: package
          persist-credentials: false
          clean: true
      - name: VALIDATE Windows runner, both commit SHAs and owner arm
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'color-team-ops-windows-01' -or $env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Unapproved Windows runner' }
          if ((git -C harness rev-parse HEAD).Trim() -ne $env:EXPECTED_EVENT_SHA) { throw 'Harness event SHA changed' }
          if ((git -C package rev-parse HEAD).Trim() -ne $env:PACKAGE_SHA) { throw 'Candidate SHA changed' }
          if ((Get-Content -LiteralPath 'harness/ops/acceptance/idea-feature-library-v002-package-smoke-arm.txt' -Raw).Trim() -ne 'APPROVED-V002-CLEAN-PACKAGE-ONESHOT') { throw 'Arm mismatch' }
          foreach ($forbidden in @('package/.github', 'package/ops', 'package/governance', 'package/AGENTS.md')) {
            if (Test-Path -LiteralPath $forbidden) { throw "Unexpected authority or runner content: $forbidden" }
          }
          Write-Output "PACKAGE_WINDOWS_PREFLIGHT_PASS=$env:PACKAGE_SHA"
      - name: VALIDATE clean package and fresh host on Windows
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -B harness/.github/scripts/v002_portable_package_smoke.py --package package --sha $env:PACKAGE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Windows package smoke failed' }
          Write-Output "PACKAGE_STANDALONE_WINDOWS_PASS=$env:PACKAGE_SHA"
      - name: INTERNAL AUDITOR verify no source/host mutations
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C harness rev-parse HEAD).Trim() -ne $env:EXPECTED_EVENT_SHA) { throw 'Harness source changed' }
          if ((git -C package rev-parse HEAD).Trim() -ne $env:PACKAGE_SHA) { throw 'Package candidate changed' }
          if (git -C package status --porcelain --untracked-files=all) { throw 'Package workspace mutated' }
          if (git -C harness status --porcelain --untracked-files=all) { throw 'Harness workspace mutated' }
          Write-Output "PACKAGE_INTERNAL_AUDITOR_SCOPED_PASS=$env:PACKAGE_SHA"
          Write-Output "HEAD_FINAL_RELEASE_PACKAGE_SMOKE_PASS=$env:PACKAGE_SHA"
          Write-Output 'Unpublished: no external reviewer, release tag, merger or Governance registration'
